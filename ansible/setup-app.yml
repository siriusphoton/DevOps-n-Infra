---

- name: Configure SecureDoc Web Server

  hosts: webservers

  become: yes



  tasks:

    - name: Update apt cache

      apt:

        update_cache: yes



    - name: Install Python and Pip

      apt:

        name: 

          - python3-pip

          - python3-venv

        state: present



    - name: Create App Directory

      file:

        path: /var/www/html/app

        state: directory

        mode: '0755'

        owner: ubuntu



    - name: Create App Virtual Environment

      command: python3 -m venv /var/www/html/app/venv

      args:

        creates: /var/www/html/app/venv  # Only runs if the venv folder doesn't exist



    - name: Install Flask and Boto3 in Venv

      pip:

        name: 

          - flask

          - boto3

          - gunicorn

        virtualenv: /var/www/html/app/venv  # This is the "magic" line that fixes your error



    - name: Copy App Files

      copy:

        src: ../app/

        dest: /var/www/html/app/



    # Project 5 Requirement: Create Maintenance User

    - name: Create Maintenance User

      user:

        name: maintenance

        shell: /bin/bash



    # Secure the file so Maintenance user cannot edit it (Project 5)

    - name: Secure App Code

      file:

        path: /var/www/html/app/app.py

        owner: root

        group: root

        mode: '0644'



    - name: Start App (Using Venv Python)

      shell: |

        # We call the python binary directly from the venv

        nohup /var/www/html/app/venv/bin/python3 app.py > app.log 2>&1 &

      args:

        chdir: /var/www/html/app

      async: 45

      poll: 0
