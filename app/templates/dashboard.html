<!DOCTYPE html>

<html>

<head>

    <title>SecureDoc Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="mb-4">SecureDoc Corporate Portal</h2>

        

        <div class="card p-4 mb-4">

            <h5>Upload Document</h5>

            <form method="post" enctype="multipart/form-data">

                <div class="input-group">

                    <input type="file" name="file" class="form-control">

                    <button type="submit" class="btn btn-primary">Upload</button>

                </div>

            </form>

        </div>



        <div class="card p-4">

            <h5>Secure Files</h5>

            <table class="table">

                <thead><tr><th>Filename</th><th>Size (Bytes)</th><th>Action</th></tr></thead>

                <tbody>

                    {% for file in files %}

                    <tr>

                        <td>{{ file.name }}</td>

                        <td>{{ file.size }}</td>

                        <td><a href="{{ file.url }}" target="_blank" class="btn btn-sm btn-outline-success">View Securely</a></td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
